<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti &amp; Rahul · Wedding</title>
<meta name="description" content="Wedding invitation of Shruti and Rahul: Mehendi on 18th November, Muhurtham and Reception on Friday 20th November 2026, Mumbai">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#efe7d8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="../assets/lobe.webp">
<link rel="preload" as="image" href="../assets/lobe_r.webp">
<link rel="preload" as="image" href="../assets/muhurtham-reception/1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=5">
</head>
<body>

<div id="petals" aria-hidden="true"></div>

<main class="scene" id="scene">
  <div class="stage" id="stage" style="--ratio: 1">
    <div class="shadow" aria-hidden="true"></div>

    <div class="wrap" id="wrap" role="button" tabindex="0" aria-label="Open the invitation">
      <!-- banana leaf: base behind the card, two folding lobes -->
      <div class="leaf" aria-hidden="true">
        <div class="base"></div>
        <div class="flap flap-r" id="flapR"><img src="../assets/lobe_r.webp" alt="" draggable="false"></div>
        <div class="flap flap-l" id="flapL"><img src="../assets/lobe.webp" alt="" draggable="false"></div>
      </div>

      <!-- the invitation: main.js turns through the pages listed below -->
      <div class="card" id="card">
        <div class="face front"><img draggable="false" alt=""></div>
        <div class="face back"><img draggable="false" alt=""></div>
      </div>
      <div class="pages" hidden>
        <img src="../assets/muhurtham-reception/1.jpg" alt="You are invited to join us for an evening of Mehendi ceremony, to celebrate the colours of love, happiness and new beginnings with music and memorable moments. Wednesday 18 Nov 2026, 5:00 pm to 9:30 pm. Venue: Kasturba Hall, Senapati Bapat Marg, Tulsi Pipe Road, opposite Matunga Road Station (West), 400016. Colour theme: yellow or green.">
        <img src="../assets/muhurtham-reception/2.jpg" alt="Smt. Mahalakshmi and Shri Ravinarayan request your gracious presence to celebrate and bless the wedding of their daughter Sow. Shruti (grand daughter of late Smt. Lakshmi and Shri P. N. Seshan, and late Smt. Alamelu and Shri C. N. Vaidyanathan) with Chi. Rahul (son of Smt. Usha and Shri Rangilal Jaiswal).">
        <img src="../assets/muhurtham-reception/3.jpg" alt="Friday, 20th November 2026 at Sumati Gurjar Bhavan, Sant Vershaw Kakkaya Marg, opposite Sushrut Hospital, Swastik Park, Chembur, Mumbai 400071. Muhurtham: Abhijit Lagnam 12:15 to 1:00 pm. Reception 6:30 pm to 10:00 pm. With best compliments from Rashmi and Shanker.">
      </div>

      <!-- the red and yellow thread with its bow -->
      <svg class="tie" id="tie" viewBox="-300 0 1600 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">

        <g class="rope loose loose-l">
          <path class="rim"  d="M 0 468 C -60 470 -110 520 -150 560 C -200 610 -260 600 -270 640 C -280 690 -230 700 -200 660"/>
          <path class="red"  d="M 0 468 C -60 470 -110 520 -150 560 C -200 610 -260 600 -270 640 C -280 690 -230 700 -200 660"/>
          <path class="twist" d="M 0 468 C -60 470 -110 520 -150 560 C -200 610 -260 600 -270 640 C -280 690 -230 700 -200 660"/>
          <path class="twist2" d="M 0 468 C -60 470 -110 520 -150 560 C -200 610 -260 600 -270 640 C -280 690 -230 700 -200 660"/>
          <g class="fray" transform="translate(-200 660)">
            <path d="M0 0 l-14 24 M0 0 l2 30 M0 0 l16 22"/>
          </g>
        </g>

        <g class="rope loose loose-r">
          <path class="rim"  d="M 1000 472 C 1060 470 1100 430 1140 400 C 1190 360 1240 400 1230 450 C 1220 500 1180 520 1210 560"/>
          <path class="red"  d="M 1000 472 C 1060 470 1100 430 1140 400 C 1190 360 1240 400 1230 450 C 1220 500 1180 520 1210 560"/>
          <path class="twist" d="M 1000 472 C 1060 470 1100 430 1140 400 C 1190 360 1240 400 1230 450 C 1220 500 1180 520 1210 560"/>
          <path class="twist2" d="M 1000 472 C 1060 470 1100 430 1140 400 C 1190 360 1240 400 1230 450 C 1220 500 1180 520 1210 560"/>
          <g class="fray" transform="translate(1210 560)">
            <path d="M0 0 l-12 26 M0 0 l6 30 M0 0 l20 18"/>
          </g>
        </g>

        <g class="rope band">
          <path class="rim"  d="M -20 470 C 300 462 700 476 1040 468"/>
          <path class="red"  d="M -20 470 C 300 462 700 476 1040 468"/>
          <path class="twist" d="M -20 470 C 300 462 700 476 1040 468"/>
          <path class="twist2" d="M -20 470 C 300 462 700 476 1040 468"/>
          <g class="fray" transform="translate(1040 468)">
            <path d="M0 0 l16 -20 M0 0 l24 2 M0 0 l14 20"/>
          </g>
        </g>

        <g class="bow">
          <g class="rope loop loop-a">
            <path class="rim"  d="M 470 470 C 540 440 600 370 650 320 C 700 270 760 280 750 340 C 740 400 640 430 560 460 C 520 475 490 480 470 470"/>
            <path class="red"  d="M 470 470 C 540 440 600 370 650 320 C 700 270 760 280 750 340 C 740 400 640 430 560 460 C 520 475 490 480 470 470"/>
            <path class="twist" d="M 470 470 C 540 440 600 370 650 320 C 700 270 760 280 750 340 C 740 400 640 430 560 460 C 520 475 490 480 470 470"/>
          <path class="twist2" d="M 470 470 C 540 440 600 370 650 320 C 700 270 760 280 750 340 C 740 400 640 430 560 460 C 520 475 490 480 470 470"/>
          </g>
          <g class="rope loop loop-b">
            <path class="rim"  d="M 470 470 C 420 500 350 560 310 620 C 270 680 290 730 340 700 C 390 670 420 590 450 520 C 460 495 470 480 470 470"/>
            <path class="red"  d="M 470 470 C 420 500 350 560 310 620 C 270 680 290 730 340 700 C 390 670 420 590 450 520 C 460 495 470 480 470 470"/>
            <path class="twist" d="M 470 470 C 420 500 350 560 310 620 C 270 680 290 730 340 700 C 390 670 420 590 450 520 C 460 495 470 480 470 470"/>
          <path class="twist2" d="M 470 470 C 420 500 350 560 310 620 C 270 680 290 730 340 700 C 390 670 420 590 450 520 C 460 495 470 480 470 470"/>
          </g>
          <g class="rope tail">
            <path class="rim"  d="M 470 470 C 500 540 520 620 520 700 C 520 760 540 820 530 880"/>
            <path class="red"  d="M 470 470 C 500 540 520 620 520 700 C 520 760 540 820 530 880"/>
            <path class="twist" d="M 470 470 C 500 540 520 620 520 700 C 520 760 540 820 530 880"/>
          <path class="twist2" d="M 470 470 C 500 540 520 620 520 700 C 520 760 540 820 530 880"/>
            <g class="fray" transform="translate(530 880)">
              <path d="M0 0 l-14 28 M0 0 l0 34 M0 0 l14 28"/>
            </g>
          </g>
          <g class="rope knot">
            <path class="rim"  d="M 445 452 C 470 445 495 448 500 470 C 505 492 480 500 458 494 C 438 488 432 462 445 452 Z"/>
            <path class="red"  d="M 445 452 C 470 445 495 448 500 470 C 505 492 480 500 458 494 C 438 488 432 462 445 452 Z"/>
            <path class="twist" d="M 445 452 C 470 445 495 448 500 470 C 505 492 480 500 458 494 C 438 488 432 462 445 452 Z"/>
          <path class="twist2" d="M 445 452 C 470 445 495 448 500 470 C 505 492 480 500 458 494 C 438 488 432 462 445 452 Z"/>
          </g>
          <!-- generous invisible hit area over the bow -->
          <circle class="hit" cx="480" cy="480" r="260"/>
        </g>
      </svg>
    </div>
  </div>

  <p class="hint" id="hint" aria-live="polite">Tap the knot to open</p>

  <div class="controls" id="controls" hidden>
    <button type="button" class="btn ghost" id="prevBtn" hidden>Previous page</button>
    <button type="button" class="btn" id="nextBtn">Turn the card over</button>
    <span class="dots" id="dots" hidden></span>
    <button type="button" class="btn ghost" id="closeBtn" aria-label="Wrap the invitation again">Wrap it again</button>
  </div>
</main>

<script src="../main.js?v=5" defer></script>
</body>
</html>
