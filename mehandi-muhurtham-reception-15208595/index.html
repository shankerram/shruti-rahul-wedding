<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shruti &amp; Rahul - Wedding Invitation</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Shruti &amp; Rahul - Wedding Invitation">
<meta property="og:url" content="https://shrutiwedsrahul.in/mehandi-muhurtham-reception-15208595/">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#efe7d8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="../assets/lobe.webp">
<link rel="preload" as="image" href="../assets/lobe_r.webp">
<link rel="preload" as="image" href="../assets/muhurtham-reception/1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=18">
</head>
<body>

<div id="petals" aria-hidden="true"></div>
<audio id="music" loop preload="none">
  <source src="../assets/music.m4a?v=2" type="audio/mp4">
  <source src="../assets/music.mp3?v=2" type="audio/mpeg">
</audio>
<button type="button" class="sound" id="soundBtn" aria-pressed="true" aria-label="Music on" title="Music on / off" hidden>🔊</button>

<main class="scene" id="scene">
  <div class="stage" id="stage" style="--ratio: 1">
    <div class="shadow" aria-hidden="true"></div>

    <div class="wrap" id="wrap" role="button" tabindex="0" aria-label="Open the invitation">
      <!-- banana leaf: base behind the card, two folding lobes -->
      <div class="leaf" aria-hidden="true">
        <div class="base"></div>
        <div class="flap flap-r" id="flapR"><img src="../assets/lobe_r.webp" alt="" draggable="false"></div>
        <div class="flap flap-l" id="flapL"><img src="../assets/lobe.webp" alt="" draggable="false"></div>
      </div>

      <!-- the invitation: main.js turns through the pages listed below -->
      <div class="card" id="card">
        <div class="face front"><img draggable="false" alt=""><span class="sway" aria-hidden="true"></span></div>
        <div class="face back"><img draggable="false" alt=""><span class="sway" aria-hidden="true"></span></div>
      </div>
      <div class="pages" hidden>
        <img data-petals="pink" src="../assets/muhurtham-reception/1.jpg" alt="You are invited to join us for an evening of Mehendi ceremony, to celebrate the colours of love, happiness and new beginnings with music and memorable moments. Wednesday 18 Nov 2026, 5:00 pm to 9:30 pm. Venue: Kasturba Hall, Senapati Bapat Marg, Tulsi Pipe Road, opposite Matunga Road Station (West), 400016. Colour theme: yellow or green.">
        <img data-sway src="../assets/muhurtham-reception/2.jpg" alt="Smt. Mahalakshmi and Shri Ravinarayan request your gracious presence to celebrate and bless the wedding of their daughter Sow. Shruti (grand daughter of late Smt. Lakshmi and Shri P. N. Seshan, and late Smt. Alamelu and Shri C. N. Vaidyanathan) with Chi. Rahul (son of Smt. Usha and Shri Rangilal Jaiswal).">
        <img data-sway src="../assets/muhurtham-reception/3.jpg" alt="Friday, 20th November 2026 at Sumati Gurjar Bhavan, Sant Vershaw Kakkaya Marg, opposite Sushrut Hospital, Swastik Park, Chembur, Mumbai 400071. Muhurtham: Abhijit Lagnam 12:15 to 1:00 pm. Reception 6:30 pm to 10:00 pm. With best compliments from Rashmi and Shanker.">
      </div>

      <!-- the red and yellow thread with its bow -->
      <svg class="tie" id="tie" viewBox="-300 0 1600 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <!-- one cord in two visible pieces (it passes behind the card): main.js morphs their shape
             from a tied bow, through loosened and pulled-through stages, to lying open on the table -->
        <g class="rope" id="cordL">
          <path class="rim"/><path class="red"/><path class="twist"/><path class="twist2"/>
          <g class="fray" id="frayL"><path d="M0 0 l-14 24 M0 0 l2 30 M0 0 l16 22"/></g>
        </g>
        <g class="rope" id="cordR">
          <path class="rim"/><path class="red"/><path class="twist"/><path class="twist2"/>
          <g class="fray" id="frayR"><path d="M0 0 l-16 22 M0 0 l-2 30 M0 0 l14 24"/></g>
        </g>
        <!-- generous invisible hit area over the knot -->
        <circle class="hit" cx="480" cy="480" r="260"/>
      </svg>
    </div>
  </div>

  <p class="hint" id="hint" aria-live="polite">Tap the knot to open</p>

  <div class="controls" id="controls" hidden>
    <button type="button" class="btn ghost is-ghosted" id="prevBtn">Previous page</button>
    <button type="button" class="btn" id="nextBtn">Next page</button>
    <span class="dots" id="dots" hidden></span>
    <button type="button" class="btn ghost" id="closeBtn" aria-label="Wrap the invitation again">Wrap it again</button>
    <p class="note"><span aria-hidden="true">🔍</span> Zoom in to enlarge the card</p>
  </div>
</main>

<script src="../main.js?v=18" defer></script>
</body>
</html>
